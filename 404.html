<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 • Sustaina Trip</title>

  <meta
    name="description"
    content="Página não encontrada — Sustaina Trip Turismo."
  />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #0f172a;
      --overlay: rgba(15, 23, 42, 0.72);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;

      color: var(--text);

      background:
        linear-gradient(var(--overlay), var(--overlay)),
        url('https://github.com/knnrz/SustainaTurHome/blob/main/img%2F404.jpg') center/cover no-repeat;

      position: relative;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 720px;

      text-align: center;

      background: var(--card);
      backdrop-filter: blur(14px);

      border: 1px solid var(--border);

      border-radius: 32px;

      padding: 4rem 2rem;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .code {
      font-size: clamp(5rem, 12vw, 8rem);
      font-weight: 700;
      line-height: 1;

      margin-bottom: 1.5rem;

      color: var(--accent);

      letter-spacing: -4px;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 600;

      margin-bottom: 1rem;
    }

    p {
      color: var(--muted);

      font-size: 1.05rem;
      line-height: 1.8;

      max-width: 560px;

      margin: 0 auto 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 0.6rem;

      padding: 1rem 2rem;

      border-radius: 999px;

      text-decoration: none;

      font-weight: 600;
      font-size: 1rem;

      color: white;

      background: var(--accent);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .btn:hover {
      background: var(--accent-hover);

      transform: translateY(-2px);

      box-shadow:
        0 8px 20px rgba(34, 197, 94, 0.3);
    }

    footer {
      margin-top: 2rem;

      font-size: 0.85rem;

      color: rgba(255, 255, 255, 0.6);
    }

    @media (max-width: 640px) {

      .container {
        padding: 3rem 1.5rem;
        border-radius: 24px;
      }

      p {
        font-size: 0.98rem;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="code">404</div>

    <h1>Caminho não encontrado</h1>

    <p>
      Parece que esta trilha não existe mais ou foi movida.
      Mas toda jornada reserva novos caminhos para explorar.
    </p>

    <a href="../index.html" class="btn">
      ← Voltar para o início
    </a>

    <footer>
      Sustaina Trip Turismo • Experiências com propósito
    </footer>

  </main>

</body>
</html>
